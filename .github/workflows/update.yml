name: 同步 Artale 公告

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch announcements
        run: python scripts/scrape.py
      - name: Commit if changed
        run: |
          git config user.name "artale-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json feed.xml
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "更新公告 $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
      - name: Notify new posts (GitHub issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/notify.py
